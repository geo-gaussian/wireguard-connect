name: Build and test WireGuard Connect

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened] # cspell:disable-line
  workflow_dispatch:
    inputs:
      run_integration_tests:
        description: Run integration tests
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_integration_tests:
        description: Run integration tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Lint, test, and build (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Audit production dependencies
        if: matrix.node == 24
        run: pnpm audit --prod --audit-level high

      - name: Build
        run: pnpm run build

      - name: Check both bundles are tracked
        run: git ls-files --error-unmatch dist/main/index.js dist/post/index.js

      - name: Check committed bundle
        run: git diff --exit-code -- dist

  integration-pr:
    name: Integration tests (${{ matrix.scenario }})
    if: >-
      github.event_name == 'pull_request' &&
      github.workflow_ref == format('geo-gaussian/wireguard-connect/.github/workflows/build-and-deploy.yaml@{0}', github.ref)
    environment: integration-approval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [success, failure]
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Run integration scenario
        uses: ./.github/actions/integration-test
        with:
          scenario: ${{ matrix.scenario }}

  integration-requested:
    name: Integration tests (${{ matrix.scenario }})
    if: >-
      (github.event_name == 'push' &&
      github.workflow_ref == format('geo-gaussian/wireguard-connect/.github/workflows/build-and-deploy.yaml@{0}', github.ref)) ||
      inputs.run_integration_tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [success, failure]
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Run integration scenario
        uses: ./.github/actions/integration-test
        with:
          scenario: ${{ matrix.scenario }}

  integration-gate:
    name: Integration gate
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.workflow_ref == format('geo-gaussian/wireguard-connect/.github/workflows/build-and-deploy.yaml@{0}', github.ref)
    needs: integration-pr
    runs-on: ubuntu-latest
    steps:
      - name: Require all integration scenarios to pass
        if: needs.integration-pr.result != 'success'
        run: exit 1
