name: Build and test WireGuard Connect

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      run-integration-tests:
        description: Run integration tests
        type: boolean
        default: false
      run-external-integration-tests:
        description: Run the external peer test on the selected branch
        type: boolean
        default: false
  workflow_call:
    inputs:
      run-integration-tests:
        description: Run integration tests
        type: boolean
        default: false
      run-external-integration-tests:
        description: Run the external peer test
        type: boolean
        default: false
      release-bundle-name:
        description: Name of the release bundle to test
        type: string
        default: ''

permissions:
  contents: read

jobs:
  checks:
    name: Lint, test, and build (Node.js 24)
    if: inputs.release-bundle-name == ''
    runs-on: ubuntu-latest
    env:
      REPORT_COVERAGE: >-
        ${{ github.workflow_ref == format('geo-gaussian/wireguard-connect/.github/workflows/build-and-test.yaml@{0}', github.ref) &&
        (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    outputs:
      coverage-upload-outcome: ${{ steps.upload-coverage.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        if: env.REPORT_COVERAGE != 'true'
        run: pnpm test

      - name: Test with coverage
        if: env.REPORT_COVERAGE == 'true'
        run: pnpm run test:coverage

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build
        run: pnpm run build

      - name: Check both release bundles are tracked
        if: >-
          github.event_name == 'push' && github.ref_type == 'tag' &&
          github.workflow_ref == format('geo-gaussian/wireguard-connect/.github/workflows/build-and-test.yaml@{0}', github.ref)
        run: git ls-files --error-unmatch dist/main/index.js dist/post/index.js

      - name: Check release bundles match the build
        if: >-
          github.event_name == 'push' && github.ref_type == 'tag' &&
          github.workflow_ref == format('geo-gaussian/wireguard-connect/.github/workflows/build-and-test.yaml@{0}', github.ref)
        run: git diff --exit-code -- dist

      - name: Upload coverage to Codecov
        id: upload-coverage
        if: env.REPORT_COVERAGE == 'true'
        # Report upload failures separately from the required checks.
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          disable_search: true
          disable_telem: true # cspell:disable-line
          plugins: noop
          fail_ci_if_error: true

  coverage:
    name: Unit test coverage
    needs: checks
    if: >-
      github.workflow_ref == format('geo-gaussian/wireguard-connect/.github/workflows/build-and-test.yaml@{0}', github.ref) &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Codecov upload
        if: needs.checks.outputs.coverage-upload-outcome != 'success'
        run: exit 1

  integration:
    name: Integration tests (${{ matrix.scenario }})
    if: >-
      ((github.event_name == 'pull_request' || github.event_name == 'push') &&
      github.workflow_ref == format('geo-gaussian/wireguard-connect/.github/workflows/build-and-test.yaml@{0}', github.ref)) ||
      inputs.run-integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [success, failure]
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Build integration bundles
        if: >-
          ${{ !(github.event_name == 'push' && github.ref_type == 'tag' &&
          github.workflow_ref == format('geo-gaussian/wireguard-connect/.github/workflows/build-and-test.yaml@{0}', github.ref)) }}
        uses: ./.github/actions/build-bundles
      - name: Run integration scenario
        uses: ./.github/actions/integration-test
        with:
          scenario: ${{ matrix.scenario }}

  integration-gate:
    name: Integration gate
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.workflow_ref == format('geo-gaussian/wireguard-connect/.github/workflows/build-and-test.yaml@{0}', github.ref)
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Require all integration scenarios to pass
        if: needs.integration.result != 'success'
        run: exit 1

  external-integration:
    name: Test external WireGuard peer
    if: >-
      github.repository == 'geo-gaussian/wireguard-connect' &&
      ((github.workflow_ref == format('geo-gaussian/wireguard-connect/.github/workflows/build-and-test.yaml@{0}', github.ref) &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && inputs.run-external-integration-tests))) ||
      (github.workflow_ref == format('geo-gaussian/wireguard-connect/.github/workflows/prepare-release.yaml@{0}', github.ref) &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run-external-integration-tests))
    environment: external-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: external-wireguard-integration
      cancel-in-progress: false
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Build action bundles
        if: inputs.release-bundle-name == ''
        uses: ./.github/actions/build-bundles
      - name: Download release bundles
        if: inputs.release-bundle-name != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.release-bundle-name }}
          path: dist
      - name: Register cleanup verification
        uses: ./.github/actions/external-observer
      - name: Connect to the external peer
        id: tunnel
        uses: ./
        with:
          private-key: ${{ secrets.WG_PRIVATE_KEY }}
          address: ${{ vars.WG_ADDRESS }}
          server-public-key: ${{ vars.WG_SERVER_PUBLIC_KEY }}
          endpoint: ${{ secrets.WG_ENDPOINT }}
          allowed-ips: ${{ vars.WG_ALLOWED_IPS }}
          dns-server: ${{ vars.WG_DNS_SERVER }}
          dns-domains: ${{ vars.WG_DNS_DOMAINS }}
      - name: Verify the private service
        shell: sh
        env:
          INTERFACE: ${{ steps.tunnel.outputs.interface }}
          PRIVATE_SERVICE_URL: ${{ secrets.PRIVATE_SERVICE_URL }}
        run: sh .github/actions/external-observer/verify-service.sh

  external-integration-gate:
    name: Requested external integration gate
    if: always() && inputs.run-external-integration-tests
    needs: external-integration
    runs-on: ubuntu-latest
    steps:
      - name: Require the external test to pass
        if: needs.external-integration.result != 'success'
        run: exit 1
