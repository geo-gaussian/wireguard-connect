name: Test reusable integration trigger

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened] # cspell:disable-line

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  enabled:
    uses: ./.github/workflows/build-and-deploy.yaml
    with:
      run_integration_tests: true
  disabled:
    uses: ./.github/workflows/build-and-deploy.yaml
    with:
      run_integration_tests: false
