version: '0.2'
language: en-GB

files:
  - '**/*.cjs'
  - '**/*.json'
  - '**/*.md'
  - '**/*.mjs'
  - '**/*.ts'
  - '**/*.txt'
  - '**/*.yaml'
  - '**/*.yml'

ignorePaths:
  - .git
  - node_modules
  - dist
  - coverage
  - pnpm-lock.yaml
  - '**/pnpm-lock.yaml'
  - .specify/scripts/**
  - .specify/templates/**
  - .specify/workflows/speckit/**
  - .github/skills/**

dictionaryDefinitions:
  - name: project-terms
    path: .cspell/project-terms.txt
    addWords: true

dictionaries:
  - project-terms
  - en_GB
  - node
  - softwareTerms
  - typescript

words:
  - GitHub
  - TypeScript
  - WireGuard
  - cspell
  - dnsmasq
  - netns
  - noproxy
  - pnpm
  - prettier
  - resolv
  - SpecKit
  - veth
  - wgcpeer

# Preserve the upstream Spec Kit command name.
ignoreRegExpList:
  - '/speckit-analyze/g'

# cspell:disable
flagWords:
  - behavior->behaviour
  - behaviors->behaviours
  - organization->organisation
  - organizations->organisations
  - organizational->organisational
  - synchronize->synchronise
  - synchronized->synchronised
  - synchronizing->synchronising
  - initialize->initialise
  - initialized->initialised
  - initialization->initialisation
  - artifact->artefact
  - artifacts->artefacts
  - color->colour
  - colors->colours
  - center->centre
  - centers->centres
  - analyze->analyse
  - analyzed->analysed
  - defense->defence
  - offense->offence
# cspell:enable

useGitignore: true
enableGlobDot: true
allowCompoundWords: true
